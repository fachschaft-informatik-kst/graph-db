name: Browser integration
on:
  push:
    branches: [feat/wasm-github-workspaces]
  pull_request:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test UI and WASM
        run: |
          cd dist && python3 -m http.server 8080 &
          sleep 2
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:8080/',{waitUntil:'domcontentloaded'});
          if(await page.locator('#tabs #add-tab').count()!==1)throw Error('Plus missing in tab bar');
          if(await page.locator('.actions #add-tab').count())throw Error('Old add-tab button still in actions');
          await page.locator('#tabs #add-tab').click();
          if(await page.locator('#tabs .tab').count()!==2)throw Error('Plus did not add query tab');
          await page.locator('#help-open').click();
          if(await page.locator('#help-panel').getAttribute('aria-hidden')!=='false')throw Error('Help drawer did not open');
          await page.locator('#help-panel details').first().locator('summary').click();
          await page.locator('#help-panel details').first().locator('button').click();
          if((await page.locator('#query').inputValue()).trim()!=='MATCH (n) RETURN n;')throw Error('Help example was not inserted');
          if(await page.locator('#help-panel').getAttribute('aria-hidden')!=='true')throw Error('Help drawer did not close');
          console.log('ENGINE BINDING',await page.evaluate(()=>document.querySelector('#run').onclick?.toString().slice(0,120)),'PAGE ERRORS',errors);
          await page.locator('#demo').click();
          if(!await page.locator('#query-highlight .cy-keyword').count())throw Error('Cypher syntax highlighting missing');
          await page.waitForFunction(()=>document.querySelector('#status').textContent.startsWith('LadybugDB · 5 Knoten'),null,{timeout:60000});
          const status=await page.locator('#status').innerText();
          if(!status.includes('5 Knoten')||!status.includes('4 Beziehungen'))throw Error('Demo failed: '+status);
          if(await page.locator('#graph-search').count()!==1)throw Error('Graph search missing');
          await page.locator('#query').fill("MATCH (n:Person {name:'Anna'}) RETURN n;");
          await page.locator('#run').click();
          await page.waitForFunction(()=>!document.querySelector('#run').disabled,null,{timeout:60000});
          if(await page.evaluate(()=>cy.nodes().length)!==1)throw Error('Query result graph must contain only Anna, got '+await page.evaluate(()=>cy.nodes().length));
          await page.evaluate(()=>cy.nodes().first().emit('dbltap'));
          if(await page.evaluate(()=>cy.nodes().length)<2)throw Error('Double click did not expand neighbors');
          await page.evaluate(()=>cy.getElementById('n1').emit('dbltap'));
          if(await page.evaluate(()=>cy.nodes().length)!==1)throw Error('Second double click did not collapse neighbors');
          await page.evaluate(()=>cy.nodes().first().emit('cxttap'));
          if(await page.locator('#graph-context').isHidden())throw Error('Context menu did not open');
          await page.keyboard.press('Escape');
          await page.locator('#graph-reset').click();
          await page.locator('#query').fill("MATCH (n) RETURN n;");
          await page.locator('#run').click();
          await page.waitForFunction(()=>!document.querySelector('#run').disabled,null,{timeout:60000});
          if(await page.evaluate(()=>cy.nodes().length)!==5)throw Error('All-node query graph failed');
          if(await page.locator('#graph-empty').isVisible())throw Error('Demo result graph is empty');
          await page.locator('#graph-search').fill('Anna');
          if(await page.evaluate(()=>cy.nodes().filter(n=>n.style('opacity')==='1').length)===0)throw Error('Graph search found no nodes');
          await page.locator('#graph-search').fill('');
          await page.locator('#view-both').click();
          if(!await page.locator('.results').evaluate(el=>el.classList.contains('both-views')))throw Error('Combined view missing');
          await page.locator('#view-graph').click();
          await page.locator('#graph-node-size').fill('60');
          if(await page.evaluate(()=>Math.round(cy.nodes().first().width()))!==60)throw Error('Node size change failed');
          await page.locator('#graph-reset').click();
          await page.locator('#graph-back').click();
          if(await page.locator('#fit-graph').count())throw Error('Old fit graph button still present');
          if(await page.locator('#graph-navigation button').count()!==10)throw Error('Expected ten graph icon controls');
          await page.locator('[data-action="hierarchy"]').click();
          if(await page.locator('[data-action="hierarchy"]').getAttribute('aria-pressed')!=='true')throw Error('Hierarchy layout not selected');
          await page.locator('[data-action="force"]').click();
          if(await page.locator('[data-action="force"]').getAttribute('aria-pressed')!=='true')throw Error('Force layout not selected');
          await page.locator('[data-action="circle"]').click();
          if(await page.locator('[data-action="circle"]').getAttribute('aria-pressed')!=='true')throw Error('Circular layout not selected');
          if(await page.evaluate(()=>window.graphLayout.mode())!=='circle')throw Error('Circular layout state missing');
          await page.locator('#query').fill("MATCH (n:Person) RETURN n;");
          await page.locator('#run').click();
          await page.waitForFunction(()=>!document.querySelector('#run').disabled,null,{timeout:60000});
          if(await page.evaluate(()=>window.graphLayout.mode())!=='circle')throw Error('Layout lost after query');
          await page.locator('[data-action="force"]').click();
          const z=await page.evaluate(()=>cy.zoom());
          await page.locator('[data-action="plus"]').click();
          if(await page.evaluate(()=>cy.zoom())<=z)throw Error('Zoom in failed');
          await page.locator('[data-action="minus"]').click();
          await page.locator('[data-action="fit"]').click();
          const panBefore=await page.evaluate(()=>cy.pan().x);
          await page.locator('[data-action="right"]').click();
          if(await page.evaluate(()=>cy.pan().x)===panBefore)throw Error('Pan failed');
          await page.locator('#view-table').click();
          if(await page.locator('link[rel="icon"][href="./graphdb-logo.svg"]').count()!==1)throw Error('Favicon missing');
          if(await page.locator('header .brand-logo').count()!==1)throw Error('Header logo missing');
          if(await page.locator('#table .result-grid').count()!==1)throw Error('Structured result grid missing');
          if(await page.locator('#table .result-sort').count()===0)throw Error('Sortable column headings missing');
          await page.evaluate(()=>{rows=[{name:'Anna',age:18,person:{labels:['Person'],properties:{name:'Anna',age:18}}},{name:'Max',age:17,person:{labels:['Person'],properties:{name:'Max',age:17}}}];drawTable()});
          if(await page.locator('#table .result-object summary').count()<2)throw Error('Nested object rendering missing');
          await page.locator('#table .result-object summary').first().click();
          if(!await page.locator('#table .result-properties').first().isVisible())throw Error('Property expansion failed');
          await page.locator('#table .result-sort').filter({hasText:'age'}).click();
          if((await page.locator('#table tbody tr').first().innerText()).indexOf('Max')<0)throw Error('Numeric sort failed');
          await page.locator('#table input[aria-label="Tabellenergebnisse filtern"]').fill('Anna');
          if(await page.locator('#table tbody tr').count()!==1)throw Error('Table filtering failed');
          if(!await page.locator('#table button').filter({hasText:'CSV exportieren'}).isEnabled())throw Error('CSV export missing');
          await page.evaluate(()=>{rows=[{n:{labels:['Person'],properties:{name:'Anna'}}}];drawTable()});
          const count=await page.locator('#table tr').count();
          if(count!==2)throw Error('Table rows: '+count);
          await page.locator('#share').click();
          if(!await page.locator('#connect-github').isVisible())throw Error('GitHub dialog missing');
          if(!await page.locator('#gist-username').isVisible())throw Error('Gist username field missing');
          await page.locator('#close').click();
          page.once('dialog',d=>d.accept());
          await page.locator('#reset-db').click();
          await page.waitForFunction(()=>document.querySelector('#status').textContent==='Datenbank geleert',null,{timeout:60000});
          const dataset=await (await page.request.get('http://127.0.0.1:8080/daten/NEO4J_Freundschaften_GraphDB.cypher')).text();
          await page.locator('#file').setInputFiles({name:'beispiel.cypher',mimeType:'text/plain',buffer:Buffer.from(dataset)});
          try{await page.waitForFunction(()=>{const s=document.querySelector('#status').textContent;return s.startsWith('LadybugDB · 27 Knoten')||s.startsWith('Fehler')||s.includes('Startfehler')},null,{timeout:120000})}catch(e){throw Error('Dataset import stuck: '+await page.locator('#status').innerText())}
          console.log('DATASET STATUS:',await page.locator('#status').innerText());
          const first=await page.locator('#status').innerText();
          if(!first.includes('59 Beziehungen'))throw Error('Dataset first import failed: '+first);
          await page.locator('#run').click();
          await page.waitForFunction(()=>!document.querySelector('#run').disabled,null,{timeout:90000});
          const second=await page.locator('#status').innerText();
          if(!second.includes('27 Knoten')||!second.includes('59 Beziehungen'))throw Error('Repeated import duplicates: '+second);
          const colors=await page.locator('#label-colors input[type=color]').count();
          if(colors!==5)throw Error('Expected five node labels, got '+colors);
          await page.locator('#query').fill("CREATE (:Produkt {id:'P1', name:'Test'});");
          await page.locator('#run').click();
          await page.waitForFunction(()=>!document.querySelector('#run').disabled,null,{timeout:60000});
          if(!(await page.locator('#status').innerText()).includes('28 Knoten'))throw Error('Generic label import failed: '+await page.locator('#status').innerText());
          const mobile=await browser.newPage({viewport:{width:390,height:844}});
          await mobile.goto('http://127.0.0.1:8080/');
          await mobile.locator('#demo').click();
          if(await mobile.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2))throw Error('Mobile horizontal overflow');
          await mobile.close();
          await page.goto('http://127.0.0.1:8080/wasm.html');
          await page.locator('#wasm-init').click();
          await page.waitForTimeout(30000);
          const wasm=await page.locator('#wasm-status').innerText();
          if(!wasm.includes('WASM initialisiert'))throw Error('WASM failed: '+wasm);
          await page.locator('#wasm-run').click();
          await page.waitForTimeout(2000);
          const result=await page.locator('#wasm-status').innerText();
          if(!result.includes('Cypher ausgeführt'))throw Error('Cypher failed: '+result);
          if(errors.length)throw Error('Page errors: '+errors.join('; '));
          await browser.close();
          console.log('Browser integration passed');
          EOF
